services:
  api:
    build: .
    image: coastal-surveillance:latest
    command: python3.11 Fast_api.py
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./checkpoints:/app/checkpoints
      - ./chroma_db:/app/chroma_db
    env_file:
      - .env
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  ui:
    build: .
    image: coastal-surveillance:latest
    command: python3.11 gradio_ui.py
    ports:
      - "7860:7860"
    environment:
      API_URL: http://api:8000/analyze_video
    depends_on:
      - api
    restart: unless-stopped
